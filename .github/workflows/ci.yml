name: CI

# 质量门禁：类型检查 / 规范 / 测试 / IPC 契约 / Rust 测试 / 构建
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  quality:
    name: 类型检查 / 规范 / 测试 / 契约 / 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: 安装依赖
        # 跳过 postinstall 的内核下载：CI 只做静态校验与测试，不需要内核二进制
        run: npm ci --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      - name: 代码规范
        run: npx eslint . --max-warnings=200

      - name: 前端单元测试
        run: npm run test

      - name: IPC 契约一致性
        run: npm run check:ipc

      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 前端构建
        run: npx vite build
