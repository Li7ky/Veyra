name: Release

# 推送 v* 标签后：在 Windows 上打包 NSIS 安装包并创建 GitHub Release。
# 示例：
#   git tag v1.1.9-beta.1
#   git push origin v1.1.9-beta.1
# 标签去掉 v 后必须与 src/package.json 的 version 一致。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（含 v 前缀，须已存在于仓库）"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: src
    shell: pwsh

jobs:
  release:
    name: 打包并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 解析标签
        id: meta
        working-directory: .
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v') {
            throw "标签必须以 v 开头，例如 v1.1.9-beta.1，当前：$tag"
          }
          $version = $tag.Substring(1)
          $prerelease = if ($version -match '(?i)(alpha|beta|rc|pre)') { "true" } else { "false" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag version=$version prerelease=$prerelease"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: 校验版本号与标签一致
        run: |
          $pkg = node -p "require('./package.json').version"
          $expected = "${{ steps.meta.outputs.version }}"
          if ($pkg -ne $expected) {
            throw "标签版本 $expected 与 package.json 版本 $pkg 不一致，请先改 version 再打标签。"
          }
          Write-Host "version OK: $pkg"

      - name: 安装依赖
        # 跳过 postinstall；内核在下一步单独下载，避免 CI 偶发网络失败时整次 ci 重跑
        run: npm ci --ignore-scripts

      - name: 质量门禁
        run: npm run verify

      - name: 下载内核并打包
        run: |
          npm run download-core
          npm run build-icons
          npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --win --publish never
        env:
          # electron-builder 偶发读 GH token；只读下载内核无关，发布由 gh 完成
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 确认安装包已生成
        working-directory: .
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $exes) {
            Get-ChildItem -Path release -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
            throw "未找到 release/*.exe，打包失败。"
          }
          $exes | ForEach-Object { Write-Host "$($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - name: 生成 Release 说明
        id: notes
        working-directory: .
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $changelogPath = "src/electron/changelog.json"
          $bodyPath = "release-notes.md"
          $lines = @()
          $lines += "## Veyra-omini $version"
          $lines += ""
          if (Test-Path $changelogPath) {
            $entries = Get-Content $changelogPath -Raw | ConvertFrom-Json
            $entry = $entries | Where-Object { $_.version -eq $version } | Select-Object -First 1
            if ($entry) {
              if ($entry.title) { $lines += "### $($entry.title)"; $lines += "" }
              foreach ($item in @($entry.items)) {
                $lines += "- $item"
              }
              $lines += ""
            }
          }
          $lines += "Windows 10/11 x64 安装包见下方 Assets。"
          $lines += "测试版未做代码签名；升级前建议备份配置。"
          $lines += ""
          $lines += "验证说明见仓库内 ``TESTING.md``（若有）。"
          ($lines -join "`n") + "`n" | Set-Content -Path $bodyPath -Encoding utf8NoBOM
          "path=$bodyPath" >> $env:GITHUB_OUTPUT
          Get-Content $bodyPath

      - name: 创建 GitHub Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Veyra-omini ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            release/*.exe
            release/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
