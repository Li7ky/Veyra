appId: com.veyra.omini
productName: Veyra-omini
copyright: Copyright © Veyra-omini

directories:
  # 输出到工作区之外：工作区内的构建产物会被文件监视占用，导致下次打包无法清理旧目录
  output: D:/Veyra-omini
  buildResources: resources/icons

files:
  - dist/**/*
  - electron/**/*
  - package.json
  # 主进程要解析 Clash YAML 做 sing-box 转换，这两个小包必须打进去
  - node_modules/js-yaml/**/*
  - node_modules/argparse/**/*

extraResources:
  - from: resources/bin
    to: bin
  - from: resources/icons
    to: icons
  - from: resources/config
    to: config
  # 内核按需下载/更新脚本：主进程在运行时用 Node 执行（asar 内文件无法被 Node 读取，
  # 必须解包到 resources 下），否则打包版的「安装/更新内核」按钮必然失败
  - from: scripts
    to: scripts
    filter:
      - download-mihomo.mjs
      - download-singbox.mjs

asar: true

# 打包后写入 exe 图标/版本信息（脚本见 scripts/after-pack.cjs）。
# 不能直接用 signAndEditExecutable：它依赖 winCodeSign 解压，而该压缩包内含 macOS 符号链接，
# 无开发者模式的 Windows 上解压必然失败（Cannot create symbolic link），导致整个打包中断。
afterPack: scripts/after-pack.cjs

win:
  icon: resources/icons/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Veyra-omini
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico
  deleteAppDataOnUninstall: false

# 安装包体积：内核 mihomo.exe 会打进 extraResources
# 注意：不要配置 electronLanguages——裁剪语言包会触发批量删除限制导致打包中断，
# 保留全部语言包仅增加少量体积，无功能影响。
