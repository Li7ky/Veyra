[package]
name = "veyra-omini"
version = "1.1.10-beta.5"
description = "Veyra-omini"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：Map 保持插入序（对齐 Electron 版按 YAML 书写顺序执行 merge 键的行为，
# 否则 BTreeMap 字典序会让 rules 整体替换吞掉同文件的 prepend-rules / append-rules）。
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "fs", "process"] }
dirs = "6"
open = "5"
arboard = "3"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rquickjs = "0.9"
chrono = "0.4"
winreg = "0.55"
futures-util = "0.3"
url = "2"
percent-encoding = "2"

[profile.dev]
# QuickJS 的 cc 构建在含中文/长路径的工作区里带 /Z7 会失败（c1.dll 无法写入调试记录）。
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
